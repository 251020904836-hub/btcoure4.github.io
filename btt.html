<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Nature Explorer</h1>
        <p>Discover beautiful places and enjoy the natural world.</p>
    </header>

    <main class="gallery">
        <figure>
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
                 alt="Mountain landscape surrounded by green trees">
            <figcaption>Mountain Adventure</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
                 alt="Green valley with mountains and a blue sky">
            <figcaption>Green Valley</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
                 alt="Blue ocean waves reaching a sandy beach">
            <figcaption>Ocean Escape</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e"
                 alt="Sunlight shining through a dense forest">
            <figcaption>Forest Walk</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470"
                 alt="Large mountain range under a cloudy sky">
            <figcaption>Mountain Range</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1511497584788-876760111969"
                 alt="Tall trees forming a peaceful forest path">
            <figcaption>Peaceful Forest</figcaption>
        </figure>

        <figure>
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b"
                 alt="Snow covered mountains under a bright sky">
            <figcaption>Snowy Peaks</figcaption>
        </figure>
    </main>

    <footer>
        <p>Explore more. Travel responsibly. Protect nature.</p>
    </footer>
</body>
</html>
